<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Early Communicator Board</title>

<style>

body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#f7f7f7;
    text-align:center;
}

h1 {
    font-size:28px;
}

.container {
    padding:15px;
}

button {
    padding:12px;
    margin:4px;
    border:none;
    border-radius:12px;
    background:#5b7cfa;
    color:white;
    font-size:18px;
}


#board {

    display:grid;
    gap:15px;
    width:100%;
    max-width:900px;
    margin:auto;
}


.choice {

    background:white;
    border-radius:20px;
    box-shadow:0 3px 10px #ccc;
    min-height:180px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-size:24px;

}


.choice img {

    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:15px;

}


.choice:active {

    transform:scale(.95);

}



.editor {

    background:white;
    padding:15px;
    margin:10px auto;
    border-radius:15px;
    max-width:400px;

}


input {

    width:90%;
    padding:10px;
    margin:5px;

}


.hidden {

display:none;

}



</style>

</head>


<body>


<div class="container">


<h1>Early Communicator Board</h1>


<h3>Choose number of choices</h3>


<div>

<button onclick="createBoard(1)">1</button>
<button onclick="createBoard(2)">2</button>
<button onclick="createBoard(3)">3</button>
<button onclick="createBoard(4)">4</button>
<button onclick="createBoard(5)">5</button>
<button onclick="createBoard(6)">6</button>
<button onclick="createBoard(7)">7</button>
<button onclick="createBoard(8)">8</button>
<button onclick="createBoard(9)">9</button>

</div>


<div id="editor"></div>


<div id="board"></div>


</div>



<script>


let choices=[];



function createBoard(number){


choices=[];


for(let i=0;i<number;i++){

choices.push({

photo:"",
label:"Choice "+(i+1)

});

}


renderEditor();

renderBoard();


}




function renderEditor(){


let area=document.getElementById("editor");

area.innerHTML="";


choices.forEach((choice,index)=>{


let div=document.createElement("div");

div.className="editor";


div.innerHTML=`

<h3>Choice ${index+1}</h3>


<input type="file"
accept="image/*"
capture="environment"
onchange="addPhoto(event,${index})">


<br>


<input value="${choice.label}"
oninput="changeLabel(event,${index})">


`;


area.appendChild(div);



});


}




function addPhoto(event,index){


let file=event.target.files[0];


let reader=new FileReader();


reader.onload=function(){

choices[index].photo=reader.result;

renderBoard();

};


reader.readAsDataURL(file);


}




function changeLabel(event,index){


choices[index].label=event.target.value;

renderBoard();


}




function renderBoard(){


let board=document.getElementById("board");


board.innerHTML="";



let amount=choices.length;



if(amount===1){

board.style.gridTemplateColumns="1fr";

}

else if(amount===2){

board.style.gridTemplateColumns="repeat(2,1fr)";

}

else if(amount<=4){

board.style.gridTemplateColumns="repeat(2,1fr)";

}

else {

board.style.gridTemplateColumns="repeat(3,1fr)";

}




choices.forEach(choice=>{


let div=document.createElement("div");


div.className="choice";


div.onclick=function(){

alert(choice.label);

};



if(choice.photo){

div.innerHTML+=`

<img src="${choice.photo}">

`;

}

else{

div.innerHTML+=`

<div style="font-size:70px">
📷
</div>

`;

}


div.innerHTML+=`

<div>${choice.label}</div>

`;



board.appendChild(div);


});


}



</script>


</body>

</html>

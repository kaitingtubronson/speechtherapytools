<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Early Communicator Board</title>

<style>

body {
font-family: Arial, sans-serif;
background:#f7f7f7;
text-align:center;
padding:15px;
margin:0;
}

button {
padding:12px 18px;
border:none;
border-radius:12px;
background:#5b7cfa;
color:white;
font-size:18px;
margin:8px;
}

select,input {
padding:10px;
font-size:16px;
border-radius:8px;
}


.hidden {
display:none;
}


.editor {

background:white;
border-radius:15px;
padding:15px;
margin:15px auto;
max-width:400px;

}


.preview {

width:120px;
height:120px;
object-fit:cover;
border-radius:15px;

}


#board {

display:grid;
gap:15px;
max-width:900px;
margin:20px auto;

}


.choice {

background:white;
border-radius:20px;
min-height:220px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

font-size:26px;

box-shadow:0 3px 10px #ccc;

}


.choice img {

width:150px;
height:150px;
object-fit:cover;
border-radius:15px;

}


</style>

</head>


<body>


<h1>Early Communicator Board</h1>



<div id="setup">


<h3>How many choices?</h3>


<select id="numberChoices">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>

</select>


<br>


<button onclick="createBoard()">
Create Board
</button>


</div>




<div id="editor"></div>


<button id="doneButton" 
class="hidden"
onclick="childMode()">

Done Editing

</button>


<div id="board"></div>



<script>


let choices=[];



function createBoard(){


let amount=
document.getElementById("numberChoices").value;


choices=[];


for(let i=0;i<amount;i++){

choices.push({

photo:"",
label:""

});

}


document.getElementById("setup")
.classList.add("hidden");


document.getElementById("doneButton")
.classList.remove("hidden");


renderEditor();


}



function renderEditor(){


let editor=document.getElementById("editor");


editor.innerHTML="";


choices.forEach((choice,index)=>{


let div=document.createElement("div");

div.className="editor";


div.innerHTML=`

<h3>Choice ${index+1}</h3>


<input 
type="file"
accept="image/*"
onchange="addPhoto(event,${index})">


<br>


${choice.photo ?
`<img class="preview" src="${choice.photo}">`
:
""}


<br>


<input 
placeholder="Word"
value="${choice.label}"
oninput="addLabel(event,${index})">


`;


editor.appendChild(div);


});


}



function addPhoto(event,index){


let file=event.target.files[0];


let reader=new FileReader();


reader.onload=function(){


choices[index].photo=
reader.result;


renderEditor();


};


reader.readAsDataURL(file);


}



function addLabel(event,index){


choices[index].label=
event.target.value;


}



function childMode(){


document.getElementById("editor")
.classList.add("hidden");


document.getElementById("doneButton")
.classList.add("hidden");


renderBoard();


}



function renderBoard(){


let board=document.getElementById("board");


board.innerHTML="";


let amount=choices.length;


if(amount<=2){

board.style.gridTemplateColumns=
"repeat(2,1fr)";

}

else if(amount<=4){

board.style.gridTemplateColumns=
"repeat(2,1fr)";

}

else {

board.style.gridTemplateColumns=
"repeat(3,1fr)";

}



choices.forEach(choice=>{


let card=document.createElement("div");

card.className="choice";


if(choice.photo){

card.innerHTML=
`<img src="${choice.photo}">`;

}

else {

card.innerHTML=
"📷";

}


card.innerHTML +=
`<div>${choice.label}</div>`;


card.onclick=function(){

alert(
"Communication: "
+
choice.label
);

};


board.appendChild(card);


});


}


</script>


</body>

</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Early Communication Board</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align:center;
  background:#f7f7f7;
  margin:0;
}

h1 {
  font-size:28px;
}

.container {
  padding:20px;
}

button {
  padding:12px 18px;
  border-radius:12px;
  border:none;
  background:#5b7cfa;
  color:white;
  font-size:16px;
  margin:5px;
}

.board {
  display:grid;
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.choice {
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:0 2px 8px #ccc;
  cursor:pointer;
}

.choice img {
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:15px;
}

.choice p {
  font-size:20px;
  margin:8px;
}

.editor {
  background:white;
  padding:15px;
  margin:10px auto;
  border-radius:15px;
  max-width:400px;
}

input {
  margin:5px;
  padding:8px;
  width:90%;
}

.hidden {
  display:none;
}

@media print {
  button, .editor, h1 {
    display:none;
  }

  .choice {
    box-shadow:none;
    border:1px solid black;
  }
}
</style>

</head>

<body>

<div class="container">

<h1>Early Communication Board</h1>

<div id="setup">

<h3>Create Board</h3>

<label>Number of choices:</label>

<select id="numChoices">
<option value="1">1</option>
<option value="2">2</option>
<option value="4">4</option>
<option value="6">6</option>
<option value="9">9</option>
</select>

<br><br>

<button onclick="createBoard()">Create</button>

</div>


<div id="editorArea"></div>


<div id="board" class="board"></div>


<br>

<button onclick="saveBoard()">Save Board</button>

<button onclick="window.print()">Export PDF</button>

</div>


<script>

let boardData=[];


function createBoard(){

let num=document.getElementById("numChoices").value;

boardData=[];

for(let i=0;i<num;i++){

boardData.push({
photo:"",
label:"",
audio:""
});

}

renderEditor();

renderBoard();

}


function renderEditor(){

let area=document.getElementById("editorArea");

area.innerHTML="";


boardData.forEach((item,index)=>{


let div=document.createElement("div");

div.className="editor";


div.innerHTML=`

<h3>Choice ${index+1}</h3>

<input type="file" accept="image/*"
onchange="addPhoto(event,${index})">

<br>

<input placeholder="Label"
oninput="addLabel(event,${index})">


<br>

<button onclick="startRecording(${index})">
Record Voice
</button>

<p id="recordStatus${index}"></p>


`;

area.appendChild(div);


});

}



function addPhoto(event,index){

let file=event.target.files[0];

let reader=new FileReader();

reader.onload=function(){

boardData[index].photo=reader.result;

renderBoard();

};

reader.readAsDataURL(file);

}



function addLabel(event,index){

boardData[index].label=event.target.value;

renderBoard();

}



let recorder;
let audioChunks=[];
let currentRecording;


async function startRecording(index){

currentRecording=index;

let stream=await navigator.mediaDevices.getUserMedia({
audio:true
});


recorder=new MediaRecorder(stream);

audioChunks=[];


recorder.ondataavailable=e=>{
audioChunks.push(e.data);
};


recorder.onstop=()=>{

let blob=new Blob(audioChunks,{
type:"audio/webm"
});


let url=URL.createObjectURL(blob);


boardData[index].audio=url;


document.getElementById(
"recordStatus"+index
).innerHTML="Recorded ✓";


};


recorder.start();


setTimeout(()=>{

recorder.stop();

},3000);


}



function renderBoard(){

let board=document.getElementById("board");

board.innerHTML="";


let cols=Math.ceil(Math.sqrt(boardData.length));

board.style.gridTemplateColumns=
`repeat(${cols},150px)`;


boardData.forEach(item=>{


let div=document.createElement("div");

div.className="choice";


div.onclick=function(){

if(item.audio){

let audio=new Audio(item.audio);

audio.play();

}

};


if(item.photo){

div.innerHTML+=
`<img src="${item.photo}">`;

}


div.innerHTML+=
`<p>${item.label}</p>`;


board.appendChild(div);


});


}



function saveBoard(){

localStorage.setItem(
"communicationBoard",
JSON.stringify(boardData)
);


alert("Board saved on this device");

}


function loadBoard(){

let saved=
localStorage.getItem("communicationBoard");


if(saved){

boardData=JSON.parse(saved);

renderEditor();

renderBoard();

}

}


loadBoard();


</script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Early Communicator Board</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#f7f7f7;
    text-align:center;
    margin:0;
    padding:15px;
}

button {
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#5b7cfa;
    color:white;
    font-size:18px;
    margin:5px;
}

select {
    padding:10px;
    font-size:18px;
}

.editor {
    background:white;
    padding:15px;
    border-radius:15px;
    margin:15px auto;
    max-width:400px;
}

input {
    padding:10px;
    width:90%;
    margin:5px;
}

#board {
    display:grid;
    gap:15px;
    margin-top:20px;
}


.choice {
    background:white;
    border-radius:20px;
    min-height:200px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:24px;
    box-shadow:0 3px 10px #ccc;
}


.choice img {
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:15px;
}


.hidden {
    display:none;
}


</style>

</head>


<body>


<h1>Early Communicator Board</h1>


<div id="setup">

<h3>How many choices?</h3>


<select id="numberChoices">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>

</select>


<br><br>

<button onclick="createBoard()">
Create Board
</button>


</div>



<div id="editor"></div>


<div id="board"></div>



<script>


let choices=[];



function createBoard(){


let number=
document.getElementById("numberChoices").value;


choices=[];


for(let i=0;i<number;i++){

choices.push({

photo:"",
label:"Choice "+(i+1)

});

}



document.getElementById("setup").classList.add("hidden");


renderEditor();

renderBoard();


}



function renderEditor(){


let editor=
document.getElementById("editor");


editor.innerHTML="";


choices.forEach((choice,index)=>{


let box=document.createElement("div");

box.className="editor";


box.innerHTML=`

<h3>Choice ${index+1}</h3>


<input 
type="file"
accept="image/*"
onchange="addPhoto(event,${index})">


<br>


<input
value="${choice.label}"
oninput="changeLabel(event,${index})">


`;

editor.appendChild(box);


});


}



function addPhoto(event,index){


let file=event.target.files[0];


let reader=new FileReader();


reader.onload=function(){

choices[index].photo=reader.result;

renderBoard();

};


reader.readAsDataURL(file);


}



function changeLabel(event,index){


choices[index].label=
event.target.value;


renderBoard();


}



function renderBoard(){


let board=
document.getElementById("board");


board.innerHTML="";


let amount=choices.length;


if(amount<=2){

board.style.gridTemplateColumns="repeat(2,1fr)";

}

else if(amount<=4){

board.style.gridTemplateColumns="repeat(2,1fr)";

}

else {

board.style.gridTemplateColumns="repeat(3,1fr)";

}



choices.forEach(choice=>{


let card=document.createElement("div");

card.className="choice";


if(choice.photo){

card.innerHTML=
`<img src="${choice.photo}">`;

}

else{

card.innerHTML=
`📷`;

}


card.innerHTML +=
`<div>${choice.label}</div>`;


board.appendChild(card);


});


}


</script>


</body>

</html>

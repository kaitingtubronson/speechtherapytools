// Each friend draws from its own shuffled set; all three appear before any repeat.
const surpriseBags={},lastSurprises={};
function nextSurprise(key){
 if(!surpriseBags[key]?.length){
  const bag=[0,1,2];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  if(bag[0]===lastSurprises[key])[bag[0],bag[1]]=[bag[1],bag[0]];
  surpriseBags[key]=bag;
 }
 return lastSurprises[key]=surpriseBags[key].shift();
}

  {motion:'wiggle',bg:'#e9e7f3',art:()=>'<path d="M0 208 H320 V250 H0" fill="#d9d1e5"/><path d="M0 228 H320 M47 208 L31 250 M118 208 L112 250 M197 208 L201 250 M270 208 L287 250" stroke="#fff" stroke-width="2"/>'+motif(160,42,'<circle r="28" fill="#a8c6cb"/><path d="M-26 -8 H26 M-26 8 H26 M-8 -26 V26 M8 -26 V26" stroke="#f5ffff" stroke-width="3"/>','#a8c6cb',1,'fx-spin')+[[35,99],[276,103],[48,170],[265,178]].map(([x,y],i)=>motif(x,y,noteShape,['#a293c4','#d895a5'][i%2],.85,'fx-float')).join('')},
  {motion:'bounce',bg:'#edf3e7',art:()=>[[40,184,'#dca2a7'],[276,181,'#9fc3be']].map(([x,y,c],i)=>motif(x,y,`<rect x="-26" y="-20" width="52" height="43" rx="5" fill="${c}"/><path d="M0 -20 V23 M-26 -8 H26" stroke="#fce5a1" stroke-width="7"/><path d="M0 -21 Q-29 -43 -20 -21 Q-9 -13 0 -21 Q29 -43 20 -21 Q9 -13 0 -21" fill="none" stroke="#d7b771" stroke-width="4"/>`,c,1,'fx-walk',i*.15)).join('')+scatter(heartShape,'#e2ad98')}
 ]
};
function renderSurprise(){
 const index=state.ending,theme=themes[state.avatar][index];
 const scene=$('celebrationScene');
 scene.className='celebration-scene';
 scene.style.setProperty('--scene-bg',theme.bg);
 $('celebrationEffects').innerHTML=`<svg viewBox="0 0 320 250" preserveAspectRatio="xMidYMid meet">${theme.art()}</svg>`;
 $('celebrateChar').innerHTML=avatarSvg(3);
 $('surpriseTitle').textContent=locales[state.lang].endings[avatarKeys.indexOf(state.avatar)][index];
 void scene.offsetWidth;scene.classList.add('motion-'+theme.motion);
}

const $=id=>document.getElementById(id);
const categoryKeys=['who','where','when','what','why','feelings'];
const categoryIcons=['👤','📍','🕒','➡️','🔎','💭'];
let state={lang:'en',enabled:['who','where','feelings'],avatar:'sprig',goal:1,active:null,cues:[],growth:0,sound:true,busy:false,ending:0,emptyAnswer:false};
let finishTimer=null,buttonTimer=null,audioContext=null,lastFocus=null;
const reducedMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function t(key,values={}){let value=locales[state.lang][key];return Object.entries(values).reduce((s,[k,v])=>s.replaceAll('{'+k+'}',String(v)),value);}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function category(key){const i=categoryKeys.indexOf(key),[label,question,prompts]=locales[state.lang].categories[i];return{label,question,prompts,icon:categoryIcons[i]};}
function friendName(){return locales[state.lang].names[avatarKeys.indexOf(state.avatar)];}
function tone(frequency,duration=.14,delay=0,volume=.035){
 if(!state.sound)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
  if(!audioContext)audioContext=new Audio();
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  const ctx=audioContext,osc=ctx.createOscillator(),gain=ctx.createGain(),at=ctx.currentTime+delay;
  osc.type='triangle';osc.frequency.setValueAtTime(frequency,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(volume,at+.02);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(gain).connect(ctx.destination);osc.start(at);osc.stop(at+duration+.03);
 }catch(_){/* Sound is optional; an unavailable audio device never blocks play. */}
}
function growSound(){[330,440,554,660,880].forEach((f,i)=>tone(f,.23,i*.10,.03));}
function celebrateSound(){
 const melodies=[[523,659,784,1047],[659,784,988,1319],[392,523,659,784],[440,554,659,880],[294,440,587,880],[587,740,880,1175],[440,523,659,1047],[330,494,660,988]];
 melodies[avatarKeys.indexOf(state.avatar)].forEach((f,i)=>tone(f,.3,i*.14,.032));
 tone(523,.48,.65,.017);tone(784,.48,.65,.012);
}
function renderSound(){$('soundButton').textContent=t(state.sound?'soundOn':'soundOff');$('soundButton').setAttribute('aria-pressed',String(state.sound));}
function translateStatic(){
 document.documentElement.lang=({'en':'en','es':'es','pt':'pt-BR','zh-Hant':'zh-Hant-TW','zh-Hans':'zh-Hans'}[state.lang]);
 document.title=t('title');
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
 document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));
 renderSound();
}
function renderSetup(){
 $('categoryChecks').innerHTML=categoryKeys.map(key=>{const c=category(key);return `<label class="check"><input type="checkbox" value="${key}" ${state.enabled.includes(key)?'checked':''}><span class="icon" aria-hidden="true">${c.icon}</span><strong>${c.label}</strong><span class="tiny">${c.question}</span></label>`;}).join('');
 $('categoryChecks').querySelectorAll('input').forEach(input=>input.onchange=()=>{state.enabled=[...$('categoryChecks').querySelectorAll('input:checked')].map(x=>x.value);$('setupStatus').textContent='';});
 $('goalChoices').innerHTML=locales[state.lang].goals.map((label,i)=>`<label class="goal-choice"><input type="radio" name="detailGoal" value="${i+1}" ${state.goal===i+1?'checked':''}><span class="goal-number" aria-hidden="true">${i+1}</span><strong>${label}</strong></label>`).join('');
 $('goalChoices').querySelectorAll('input').forEach(input=>input.onchange=()=>state.goal=Number(input.value));
 renderAvatars();
}
function renderAvatars(){
 const loc=locales[state.lang];
 $('avatarChoices').innerHTML=avatarKeys.map((key,i)=>`<button class="avatar-choice ${state.avatar===key?'selected':''}" data-avatar="${key}" aria-pressed="${state.avatar===key}"><div class="avatar-preview">${avatarSvg(1,key)}</div><strong>${loc.names[i]}</strong><span class="tiny">${loc.types[i]}</span></button>`).join('');
 $('avatarChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.avatar=b.dataset.avatar;renderAvatars();$('avatarChoices').querySelector(`[data-avatar="${state.avatar}"]`).focus({preventScroll:true});});
}
function renderDetailButtons(){
 $('detailButtons').innerHTML=state.enabled.map(key=>{const c=category(key);return `<button class="detail-button ${state.active===key?'active':''}" data-key="${key}" aria-pressed="${state.active===key}"><span class="icon" aria-hidden="true">${c.icon}</span>${c.label}</button>`;}).join('');
 $('detailButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>openCategory(b.dataset.key));
}
function cancelPending(){clearTimeout(finishTimer);clearTimeout(buttonTimer);state.busy=false;$('updateButton').disabled=false;$('updateButton').textContent=t('added');$('characterFace').classList.remove('bouncing');}
function start(){
 if(!state.enabled.length){$('setupStatus').textContent=t('choose');return;}
 cancelPending();tone(440,.08,0,.008);
 state.active=null;state.cues=[];state.growth=0;state.emptyAnswer=!$('startingAnswer').value.trim();
 $('answerDisplay').textContent=$('startingAnswer').value.trim()||t('tell');$('biggerAnswer').value='';$('answerStatus').textContent='';$('setupStatus').textContent='';
 renderDetailButtons();updateGrowth();updateCues();$('promptPanel').classList.add('hidden');$('setup').classList.add('hidden');$('activity').classList.remove('hidden');
 $('activityHeading').focus({preventScroll:true});window.scrollTo(0,0);
}
function cueText(cue){return cue.custom!==undefined?cue.custom:category(cue.key).prompts[cue.index];}
function openCategory(key){
 if(state.busy)return;
 state.active=key;$('answerStatus').textContent='';
 $('detailButtons').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.key===key);b.setAttribute('aria-pressed',String(b.dataset.key===key));});
 const c=category(key);
 $('promptPanel').innerHTML=`<div class="prompt-head"><span class="icon" aria-hidden="true">${c.icon}</span><div><strong>${c.question}</strong><div class="tiny">${t('cueHelp')}</div></div></div><div class="chips">${c.prompts.map((p,i)=>{const selected=state.cues.some(x=>x.key===key&&x.index===i);return `<button class="chip ${selected?'selected':''}" data-i="${i}" aria-pressed="${selected}">${p}</button>`;}).join('')}<button class="chip" data-custom="1" aria-expanded="false">${t('own')}</button></div><div id="customWrap" class="custom-wrap hidden"><input id="customInput" class="field" placeholder="${t('typeIdea')}" aria-label="${t('typeIdea')}"><button id="addCustom" class="secondary" style="margin-top:8px">${t('addIdea')}</button></div>`;
 $('promptPanel').classList.remove('hidden');
 $('promptPanel').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
  const index=Number(b.dataset.i),found=state.cues.findIndex(x=>x.key===key&&x.index===index);
  if(found>=0)state.cues.splice(found,1);else state.cues.push({key,index});
  updateCues();openCategory(key);$('promptPanel').querySelector(`[data-i="${index}"]`).focus({preventScroll:true});
 });
 $('promptPanel').querySelector('[data-custom]').onclick=e=>{$('customWrap').classList.remove('hidden');e.currentTarget.setAttribute('aria-expanded','true');$('customInput').focus();};
 $('addCustom').onclick=()=>{const custom=$('customInput').value.trim();if(custom){if(!state.cues.some(x=>x.key===key&&x.custom===custom))state.cues.push({key,custom});updateCues();$('customInput').value='';$('customInput').focus();}};
 $('customInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addCustom').click();}};
}
function updateCues(){
 $('selectedCues').classList.toggle('hidden',!state.cues.length);
 $('cueList').innerHTML=state.cues.map((cue,i)=>`<span class="cue-tag">${category(cue.key).icon} ${escapeHtml(cueText(cue))} <button aria-label="${t('remove')}" data-remove="${i}">×</button></span>`).join('');
 $('cueList').querySelectorAll('button').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.remove);state.cues.splice(index,1);updateCues();if(state.active)openCategory(state.active);const buttons=$('cueList').querySelectorAll('button');(buttons[Math.min(index,buttons.length-1)]||$('detailButtons').querySelector('button')).focus({preventScroll:true});});
}
function updateGrowth(){
 const ratio=Math.min(1,state.growth/state.goal),stage=state.growth===0?0:Math.min(3,Math.ceil(ratio*3));
 $('characterFace').innerHTML=avatarSvg(stage);$('characterFace').style.setProperty('--growth-scale',(.42+.86*ratio).toFixed(3));
 $('characterFace').setAttribute('role','img');$('characterFace').setAttribute('aria-label',t('growthLabel',{name:friendName(),stage:stage+1}));
 $('characterName').textContent=friendName();$('characterStage').style.setProperty('--friend-color',avatarColors[avatarKeys.indexOf(state.avatar)]);
 $('stageName').textContent=t(ratio>=1?'grown':ratio===0?'ready':'growing');
 $('progressLabel').textContent=t(state.growth===0?'progressZero':'progress',{goal:state.goal,n:Math.min(state.growth,state.goal)});
 $('progressFill').style.width=ratio*100+'%';$('progressBar').setAttribute('aria-valuemax',state.goal);$('progressBar').setAttribute('aria-valuenow',Math.min(state.growth,state.goal));
}
function sparkle(){
 if(reducedMotion())return;
 const icons={sprig:['🌸','🍃'],nova:['✨','⭐'],puff:['✨','☁️'],bubbles:['🫧','✨'],ember:['💛','✨'],pip:['🌼','✨'],luna:['🌙','✨'],orbit:['⚡','✨']}[state.avatar];
 for(let i=0;i<10;i++){const s=document.createElement('span');s.className='spark';s.setAttribute('aria-hidden','true');s.textContent=icons[i%2];s.style.left='50%';s.style.top='42%';s.style.setProperty('--x',Math.cos(i/10*Math.PI*2)*105+'px');s.style.setProperty('--y',Math.sin(i/10*Math.PI*2)*92-30+'px');$('characterStage').appendChild(s);setTimeout(()=>s.remove(),1150);}
}
function updateAnswer(){
 if(state.busy)return;
 if(!state.active){$('answerStatus').textContent=t('chooseFirst');return;}
 state.busy=true;$('updateButton').disabled=true;
 const value=$('biggerAnswer').value.trim();if(value){$('answerDisplay').textContent=value;$('biggerAnswer').value='';state.emptyAnswer=false;}
 state.growth++;updateGrowth();void $('characterFace').offsetWidth;$('characterFace').classList.add('bouncing');sparkle();growSound();
 $('answerStatus').textContent=t(value?'saved':'spoken');state.active=null;renderDetailButtons();$('promptPanel').classList.add('hidden');$('updateButton').textContent=t('grew');
 buttonTimer=setTimeout(()=>{$('characterFace').classList.remove('bouncing');$('updateButton').textContent=t('added');},1050);
 finishTimer=setTimeout(()=>{state.busy=false;$('updateButton').disabled=false;if(state.growth>=state.goal)finish();},reducedMotion()?250:1200);
}
function finish(){
 state.ending=nextSurprise(state.avatar);lastFocus=document.activeElement;
 $('finalAnswer').textContent=state.emptyAnswer?'':'“'+$('answerDisplay').textContent+'”';
 $('celebrate').classList.remove('hidden');renderSurprise();
 document.querySelector('main').inert=true;document.body.style.overflow='hidden';
 $('keepGoingButton').focus({preventScroll:true});celebrateSound();
}
function closeCelebration(restoreFocus=true){
 $('celebrate').classList.add('hidden');document.querySelector('main').inert=false;document.body.style.overflow='';
 if(restoreFocus)(lastFocus?.isConnected?lastFocus:$('updateButton')).focus({preventScroll:true});
}
function showSetup(clearAnswer=false){
 cancelPending();closeCelebration(false);
 if(clearAnswer){$('startingAnswer').value='';state.emptyAnswer=true;}
 else if(!state.emptyAnswer)$('startingAnswer').value=$('answerDisplay').textContent;
 $('activity').classList.add('hidden');$('setup').classList.remove('hidden');$('setupStatus').textContent='';renderSetup();
 $('startButton').focus({preventScroll:true});window.scrollTo(0,0);
}
function changeLanguage(next){
 if(!locales[next]||next===state.lang)return;
 const old=state.lang,wasExample=$('startingAnswer').value===locales[old].example;
 const customDraft=$('customInput')?.value,customOpen=$('customWrap')&&!$('customWrap').classList.contains('hidden');
 state.lang=next;$('language').value=next;
 if(wasExample)$('startingAnswer').value=t('example');
 if($('answerDisplay').textContent===locales[old].example)$('answerDisplay').textContent=t('example');
 else if(state.emptyAnswer)$('answerDisplay').textContent=t('tell');
 translateStatic();renderSetup();renderDetailButtons();updateGrowth();updateCues();
 if(state.active){openCategory(state.active);if(customOpen){$('customWrap').classList.remove('hidden');$('promptPanel').querySelector('[data-custom]').setAttribute('aria-expanded','true');$('customInput').value=customDraft;}}
 $('setupStatus').textContent='';$('answerStatus').textContent='';
 if(!$('celebrate').classList.contains('hidden')){
  renderSurprise();$('finalAnswer').textContent=state.emptyAnswer?'':'“'+$('answerDisplay').textContent+'”';
 }
 try{localStorage.setItem('biggerAnswerLanguage',next);}catch(_){}
}
$('language').onchange=e=>changeLanguage(e.target.value);
$('startButton').onclick=start;
$('soundButton').onclick=()=>{state.sound=!state.sound;renderSound();if(state.sound)tone(660,.1);};
$('settingsButton').onclick=()=>showSetup();
$('updateButton').onclick=updateAnswer;
$('resetButton').onclick=()=>showSetup(true);
$('keepGoingButton').onclick=()=>closeCelebration();
$('newAnswerButton').onclick=()=>showSetup(true);
$('replayButton').onclick=()=>{state.ending=nextSurprise(state.avatar);renderSurprise();celebrateSound();};
$('celebrate').onkeydown=e=>{
 if(e.key==='Escape'){e.preventDefault();closeCelebration();}
 if(e.key==='Tab'){
  const buttons=[...$('celebrate').querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
};
try{const saved=localStorage.getItem('biggerAnswerLanguage');if(locales[saved])state.lang=saved;}catch(_){}
$('language').value=state.lang;$('startingAnswer').value=t('example');translateStatic();renderSetup();updateGrowth();

</script>
